name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # GettextTranslatorTest needs the extension; installing it explicitly
          # means the gettext half can never silently skip for a missing load.
          extensions: gettext
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # A skip still exits 0, so a gettext that failed to load would leave this
      # run green while the gettext half ran nothing. The unavailable-path test
      # skips whenever gettext IS present (exactly one of the two paths always
      # skips), so it is excluded here and run in the second job below.
      - name: Tests (gettext available)
        run: vendor/bin/phpunit --exclude-group gettext-unavailable --fail-on-skipped

  test-no-gettext:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }} (no gettext)

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Disable gettext so the missing-extension contract really runs. If the
          # disable were ignored the test would skip and --fail-on-skipped would
          # fail the build — which is the point: the guard is what makes the
          # asymmetry visible instead of silently green.
          extensions: :gettext
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Tests (gettext unavailable)
        run: vendor/bin/phpunit --group gettext-unavailable --fail-on-skipped
